name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

          - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
        run: ./gradlew assembleDebug -PABI=arm64-v8a --no-daemon --no-parallel


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Vexrgramm-APK
        path: TMessagesProj/build/outputs/apk/release/*.apk
